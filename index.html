<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:3001; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
  <title>星伴 - 孤独症儿童成长陪伴平台</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/app-inline.css">
</head>
<body>
  <div class="page-container" id="app">
    <!-- 登录页面 -->
    <div id="login-page" class="min-h-screen flex flex-col items-center justify-center p-6">
      <div class="w-full max-w-sm">
        <div class="text-center mb-8">
          <div class="w-20 h-20 bg-gradient-to-br from-primary to-primary-light rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
            <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-text-primary">星伴</h1>
          <p class="text-text-secondary mt-2">孤独症儿童成长陪伴平台</p>
        </div>

        <div class="bg-white rounded-2xl p-6 card-shadow">
          <form class="space-y-4" data-ui-submit="login">
            <div>
              <label class="block text-sm text-text-secondary mb-1">手机号</label>
              <input type="tel" id="login-phone" name="phone" autocomplete="username" inputmode="numeric" placeholder="请输入手机号"
                class="w-full px-4 py-3 rounded-xl border border-border bg-background text-text-primary focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
              <label class="block text-sm text-text-secondary mb-1">密码</label>
              <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="请输入密码"
                class="w-full px-4 py-3 rounded-xl border border-border bg-background text-text-primary focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <p class="text-xs text-text-muted text-center">默认密码: 123456</p>
            <button type="submit"
              class="w-full py-3 rounded-xl bg-primary text-white font-medium hover:bg-primary-dark transition-colors flex items-center justify-center gap-2">
              <span id="login-btn-text">登 录</span>
              <svg id="login-spinner" class="w-4 h-4 hidden animate-spin" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
              </svg>
            </button>
          </form>
        </div>

        <div class="text-center mt-4">
          <button data-ui-call="showRegister" class="text-primary text-sm">注册新账号</button>
        </div>
      </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="register-modal" class="fixed inset-0 bg-black/50 hidden flex items-end justify-center z-50">
      <div class="bg-white w-full max-w-md rounded-t-3xl p-6 modal-slide safe-area-bottom">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">注册账号</h2>
          <button data-ui-call="hideRegister" class="text-text-muted">✕</button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-text-secondary">手机号</label>
            <input type="tel" id="reg-phone" autocomplete="username" inputmode="numeric" placeholder="请输入手机号" class="w-full px-4 py-2.5 rounded-xl border border-border">
          </div>
          <div>
            <label class="block text-sm text-text-secondary">昵称</label>
            <input type="text" id="reg-name" placeholder="请输入昵称" class="w-full px-4 py-2.5 rounded-xl border border-border">
          </div>
          <div>
            <label class="block text-sm text-text-secondary">密码</label>
            <input type="password" id="reg-password" autocomplete="new-password" placeholder="请输入密码" class="w-full px-4 py-2.5 rounded-xl border border-border">
          </div>
          <button data-ui-call="handleRegister" class="w-full py-3 rounded-xl bg-primary text-white font-medium">注 册</button>
        </div>
      </div>
    </div>

    <!-- 主应用 -->
    <div id="main-app" class="hidden flex flex-col min-h-screen">
      <aside class="app-sidebar" aria-label="主导航">
        <div class="brand-lockup"><div class="brand-mark">星</div><div><div class="font-bold text-text-primary">星伴</div><div class="text-xs text-text-muted">成长陪伴工作台</div></div></div>
        <div class="sidebar-label">核心工作</div>
        <nav class="space-y-1">
          <button class="side-nav-item active" data-page="home" data-nav="home"><span>⌂</span><span>总览</span></button>
          <button class="side-nav-item" data-page="records" data-nav="records"><span>◫</span><span>快速记录</span></button>
          <button class="side-nav-item" data-page="strategies" data-nav="strategies"><span>◇</span><span>干预策略</span></button>
          <button class="side-nav-item" data-page="knowledge" data-nav="knowledge"><span>▩</span><span>知识问答</span></button>
          <button class="side-nav-item" data-page="worksheets" data-nav="worksheets"><span>▣</span><span>可打印表格</span></button>
          <button class="side-nav-item" data-page="dialogues" data-nav="dialogues"><span>≡</span><span>示范对话</span></button>
          <button class="side-nav-item" data-page="reports" data-nav="reports"><span>▤</span><span>成长周报</span></button>
          <button class="side-nav-item" data-page="children" data-nav="children"><span>○</span><span>孩子与记录</span></button>
        </nav>
        <div class="sidebar-label">支持服务</div>
        <nav class="space-y-1">
          <button class="side-nav-item" data-page="growth" data-nav="growth"><span>△</span><span>家长成长</span></button>
          <button class="side-nav-item" data-page="community" data-nav="community"><span>◎</span><span>同伴社区</span></button>
          <button class="side-nav-item" data-page="therapist" data-nav="therapist"><span>＋</span><span>专业协作</span></button>
          <button class="side-nav-item" data-page="profile" data-nav="profile"><span>◉</span><span>个人中心</span></button>
        </nav>
        <button data-nav="emergency" class="mt-4 w-full py-3 rounded-xl bg-emergency text-white font-semibold shadow-lg">紧急支持</button>
        <div class="sidebar-help"><div class="text-xs font-semibold mb-1">需要帮助？</div><div class="text-xs opacity-70">紧急情况请优先保障人身安全，并联系专业机构。</div></div>
      </aside>
      <!-- 头部 -->
      <header class="bg-white border-b border-border px-4 py-3 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-gradient-to-br from-primary to-primary-light rounded-xl flex items-center justify-center">
            <span class="text-white font-bold text-sm">星</span>
          </div>
          <div>
            <h1 class="font-bold text-text-primary" id="page-title">首页</h1>
            <p class="text-xs text-text-muted" id="page-subtitle">陪伴孩子每一天</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button data-nav="profile" class="relative">
            <div class="w-9 h-9 bg-secondary rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </button>
        </div>
      </header>

      <!-- 主内容区 -->
      <main class="flex-1 overflow-y-auto pb-20 scrollbar-hide" id="main-content">
        <!-- 页面内容动态插入 -->
      </main>

      <!-- 底部导航 -->
      <nav class="mobile-bottom-nav fixed bottom-0 left-0 right-0 bg-white border-t border-border z-50 safe-area-bottom">
        <div class="max-w-md mx-auto flex items-center justify-around h-16">
          <button data-nav="home" class="nav-item flex flex-col items-center justify-center gap-0.5 w-16 transition-colors text-text-muted" id="nav-home">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="text-xs">首页</span>
          </button>
          <button data-nav="records" class="nav-item flex flex-col items-center justify-center gap-0.5 w-16 transition-colors text-text-muted" id="nav-records">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span class="text-xs">快记</span>
          </button>
          <button data-nav="emergency" class="nav-item flex flex-col items-center justify-center gap-0.5 w-16 transition-colors text-text-muted relative" id="nav-emergency">
            <div class="w-10 h-10 rounded-full bg-emergency flex items-center justify-center -mt-5 shadow-lg">
              <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </div>
            <span class="text-xs">紧急</span>
          </button>
          <button data-nav="strategies" class="nav-item flex flex-col items-center justify-center gap-0.5 w-16 transition-colors text-text-muted" id="nav-strategies">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span class="text-xs">策略</span>
          </button>
          <button data-nav="children" class="nav-item flex flex-col items-center justify-center gap-0.5 w-16 transition-colors text-text-muted" id="nav-children">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
            </svg>
            <span class="text-xs">孩子</span>
          </button>
          <button data-nav="profile" class="nav-item flex flex-col items-center justify-center gap-0.5 w-16 transition-colors text-text-muted" id="nav-profile">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="text-xs">我的</span>
          </button>
        </div>
      </nav>
    </div>

    <!-- 全局加载遮罩 -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/90 flex items-center justify-center z-50 hidden">
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-text-secondary">加载中...</p>
      </div>
    </div>

    <!-- 全局消息提示 -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-text-primary text-white px-4 py-2 rounded-lg shadow-lg z-50 hidden transition-opacity">
      <span id="toast-message"></span>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
