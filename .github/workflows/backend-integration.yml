name: Backend integration

on:
  push:
    branches: [gh-pages]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/backend-integration.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/backend-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: xingban_api
      DB_USER: xingban_app
      DB_PASSWORD: app-test-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      SENSITIVE_DATA_KEY: ci-only-sensitive-data-key-with-at-least-32-characters
      REDIS_URL: redis://127.0.0.1:6379
      USE_MOCK_DB: 'false'
      ALLOW_MOCK_DB: 'false'
      WEEKLY_REPORT_SCAN_INTERVAL_MINUTES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Initialize isolated database
        run: |
          mysql -h127.0.0.1 -uroot -proot-test-password < backend/config/init_db.sql
          mysql -h127.0.0.1 -uroot -proot-test-password -e "CREATE USER 'xingban_app'@'%' IDENTIFIED BY 'app-test-password'; GRANT SELECT, INSERT, UPDATE, DELETE ON xingban_api.* TO 'xingban_app'@'%'; FLUSH PRIVILEGES;"
      - name: Static and contract checks
        run: |
          npm --prefix backend test
          npm --prefix backend run test:xss
          node scripts/product_safety_check.js
          node scripts/professional_collaboration_test.js
      - name: Real MySQL and Redis integration
        run: |
          npm --prefix backend run test:mysql
          npm --prefix backend run test:deletion
          npm --prefix backend run test:alerts
          npm --prefix backend run test:weekly-jobs
          npm --prefix backend run test:caregivers
          npm --prefix backend run test:auth
